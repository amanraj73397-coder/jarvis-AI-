<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #212121;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid #444;
            font-size: 20px;
            font-weight: bold;
        }

        .chat {
            height: calc(100vh - 145px);
            overflow-y: auto;
            padding: 25px 20px 100px;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 18px;
            padding: 15px 18px;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .jarvis {
            background: #2f2f2f;
        }

        .user {
            background: #343541;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 20px 20px;
            background: #212121;
        }

        .input-box {
            max-width: 800px;
            margin: auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: #2f2f2f;
            border: 1px solid #555;
            border-radius: 18px;
            padding: 8px 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 16px;
            padding: 12px;
            min-height: 48px;
            max-height: 150px;
        }

        textarea::placeholder {
            color: #aaa;
        }

        button {
            border: none;
            border-radius: 12px;
            background: white;
            color: black;
            padding: 11px 17px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ddd;
        }

        .typing {
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="header">
    🤖 JARVIS AI
</div>

<div class="chat" id="chat">

    <div class="message jarvis">
        Hello! 👋 Main Jarvis hoon. Kaise help karun?
    </div>

</div>

<div class="input-area">

    <div class="input-box">

        <textarea
            id="message"
            placeholder="Message JARVIS..."
            rows="1"
        ></textarea>

        <button onclick="sendMessage()">➤</button>

    </div>

</div>

<script>

const input = document.getElementById("message");
const chat = document.getElementById("chat");

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();
    }
});


async function sendMessage() {

    const message = input.value.trim();

    if (!message) {
        return;
    }

    const userMessage = document.createElement("div");

    userMessage.className = "message user";

    userMessage.textContent = message;

    chat.appendChild(userMessage);

    input.value = "";

    chat.scrollTop = chat.scrollHeight;


    const typing = document.createElement("div");

    typing.className = "message jarvis typing";

    typing.textContent = "JARVIS is thinking...";

    chat.appendChild(typing);

    chat.scrollTop = chat.scrollHeight;


    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });


        const data = await response.json();

        typing.classList.remove("typing");

        typing.textContent = data.reply;


    } catch (error) {

        typing.classList.remove("typing");

        typing.textContent =
            "Sorry, connection mein problem aa gayi. 😕";

    }

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
