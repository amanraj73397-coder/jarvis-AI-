<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: #0b0f14;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #252c35;
            background: #11161d;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .logout {
            background: #252c35;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* CHAT */

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px 15px 150px;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 18px;
            padding: 14px 17px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #2563eb;
            margin-right: max(0px, calc((100% - 800px) / 2));
            margin-left: auto;
        }

        .jarvis {
            background: #171d25;
            margin-left: max(0px, calc((100% - 800px) / 2));
        }

        .message a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }

        /* INPUT AREA */

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(
                transparent,
                #0b0f14 25%
            );
        }

        .input-box {
            max-width: 800px;
            margin: auto;
            display: flex;
            gap: 10px;
            background: #171d25;
            border: 1px solid #303945;
            border-radius: 16px;
            padding: 8px;
        }

        #messageInput {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            padding: 13px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 16px;
        }

        #sendButton {
            width: 50px;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #sendButton:disabled {
            opacity: 0.5;
        }

        /* WELCOME */

        .welcome {
            text-align: center;
            max-width: 700px;
            margin: 80px auto;
            color: #aeb7c4;
        }

        .welcome h1 {
            color: white;
            font-size: 32px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 0 12px;
            }

            #chat {
                padding: 15px 10px 130px;
            }

            .message {
                max-width: 90%;
            }

            .input-area {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        🤖 JARVIS AI
    </div>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>


<main id="chat">

    <div class="welcome" id="welcome">

        <h1>How can I help you?</h1>

        <p>
            Mujhse normal Hinglish mein bhi baat kar sakte ho. 🙂
        </p>

    </div>

</main>


<div class="input-area">

    <div class="input-box">

        <textarea
            id="messageInput"
            placeholder="Message JARVIS..."
            rows="1"
        ></textarea>

        <button id="sendButton">
            ↑
        </button>

    </div>

</div>


<script>

const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");


function addMessage(text, type) {

    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");

    message.className = "message " + type;

    if (
        typeof text === "object"
        && text.type === "link"
    ) {

        const link = document.createElement("a");

        link.href = text.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        link.textContent = text.text;

        message.appendChild(link);

    } else {

        message.textContent = text;

    }

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


async function sendMessage() {

    const message = input.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    sendButton.disabled = true;

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });


        const data = await response.json();


        if (response.status === 401) {

            window.location.href = "/";

            return;
        }


        addMessage(
            data.reply || "JARVIS ko response nahi mila.",
            "jarvis"
        );


    } catch (error) {

        addMessage(
            "Server se connection nahi ho paya. 😕",
            "jarvis"
        );

    } finally {

        sendButton.disabled = false;

        input.focus();

    }
}


sendButton.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
            && !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


async function logout() {

    try {

        await fetch("/logout");

        window.location.href = "/";

    } catch (error) {

        window.location.href = "/";

    }
}


input.focus();

</script>

</body>
</html>
